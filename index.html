</<header>
    <h1>My Budget Tracker</h1>
    <p>Track your income and expenses in one place.</p>
</header>>
<section id="add-expense">
    <h2>Add Expense</h2>

    <label for="expense-name">Expense Name:</label>
    <input type="text" id="expense-name" placeholder="e.g. Shopping">

    <label for="expense-amount">Amount (KES):</label>
    <input type="number" id="expense-amount" placeholder="e.g. 1500">

    <label for="expense-category">Category:</label>
    <input type="text" id="expense-category" placeholder="e.g. Food">

</section>
<section class="expenses-list">
    <h2>Your Expenses</h2>

    <p>No expenses yet. Your expenses will appear here.</p>

</section>
